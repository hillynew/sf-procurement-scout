# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo

services:
  - type: web
    name: sf-procurement-scout
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run web/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      # Optional integrations, all inert until set. `sync: false` means Render
      # prompts for a real value in its dashboard and never stores one here —
      # never fill these in directly in this file. See AGENTS.md.
      - key: SF_SCOUT_IMAP_HOST       # enables email bid alerts
        sync: false
      - key: SF_SCOUT_IMAP_USER
        sync: false
      - key: SF_SCOUT_IMAP_PASSWORD
        sync: false
      - key: SF_SCOUT_BONFIRE_COOKIE  # enables an authenticated Bonfire session
        sync: false
