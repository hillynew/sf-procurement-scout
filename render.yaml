# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo
#
# One web service (React SPA + FastAPI, built by the repo's Dockerfile) plus
# a Postgres database so tracked bids, notes, results, watchlists, and
# snapshots survive restarts and deploys.
#
# No `plan` fields on purpose: instance plans are managed in the Render
# dashboard, and an omitted plan makes a sync RETAIN the existing resource's
# plan instead of fighting it (a declared plan is enforced on every sync —
# which is how a leftover `plan: free` broke the sync after the database and
# web service were upgraded). Fresh deploys get Render's defaults:
# basic-256mb for the database, starter for services.

databases:
  - name: scout-db
    databaseName: scout
    user: scout

services:
  - type: web
    name: sf-procurement-scout
    runtime: docker
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scout-db
          property: connectionString
      # Cap glibc's per-thread malloc arenas. The threaded fetch scatters
      # small allocations across arenas, pinning ~150MB of RSS that no
      # malloc_trim can release; two arenas keep the retained footprint small
      # enough that back-to-back fetch cycles fit in the 512MB instance.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Optional integrations, all inert until set. `sync: false` means Render
      # prompts for a real value in its dashboard and never stores one here —
      # never fill these in directly in this file. See AGENTS.md.
      - key: SF_SCOUT_ANTHROPIC_KEY   # enables AI deal briefs (Claude API)
        sync: false
      - key: SF_SCOUT_SAM_KEY         # enables federal bids via SAM.gov
        sync: false
      - key: RESEND_API_KEY           # enables email digests
        sync: false
      - key: SF_SCOUT_DIGEST_TO       # default digest recipient
        sync: false
      - key: SF_SCOUT_DIGEST_FROM     # digest sender, e.g. Scout <scout@yourdomain.com>
        sync: false
      - key: SF_SCOUT_IMAP_HOST       # enables email bid alerts
        sync: false
      - key: SF_SCOUT_IMAP_USER
        sync: false
      - key: SF_SCOUT_IMAP_PASSWORD
        sync: false
      - key: SF_SCOUT_BONFIRE_COOKIE  # enables an authenticated Bonfire session
        sync: false

  # Scheduled fetch — wakes the web service and kicks a background fetch
  # every 4 hours, so data stays fresh around the clock. Stdlib-only; a 409
  # means a fetch is already running and counts as success. Created live on
  # 2026-08-09 (scout-fetch-cron); syncs adopt it by name rather than
  # creating a duplicate.
  - type: cron
    name: scout-fetch-cron
    runtime: python
    region: oregon
    branch: main
    schedule: "0 */4 * * *"
    buildCommand: echo "no build needed — stdlib only"
    startCommand: |
      python - <<'PYEOF'
      import os, sys, time, urllib.error, urllib.request

      url = os.environ.get("SCOUT_URL", "https://sf-procurement-scout.onrender.com") + "/api/fetch"
      for attempt in range(3):
          try:
              r = urllib.request.urlopen(urllib.request.Request(url, method="POST"), timeout=180)
              print("fetch started:", r.status, r.read()[:200])
              sys.exit(0)
          except urllib.error.HTTPError as e:
              if e.code == 409:
                  print("a fetch is already running - that's fine")
                  sys.exit(0)
              print("http error", e.code, "- attempt", attempt + 1)
          except Exception as e:
              print("retry after:", e)
          time.sleep(30)
      sys.exit(1)
      PYEOF
    envVars:
      - key: SCOUT_URL
        value: https://sf-procurement-scout.onrender.com
