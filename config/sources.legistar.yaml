# Commission award approvals via the Legistar Web API — the only free,
# structured path to LOCAL award amounts found in the 2026-08-09 statewide
# survey (docs/SOURCES.md). Clients below were live-verified that day.
# Miami-Dade's instance is dead (frozen July 2018) and deliberately absent.
