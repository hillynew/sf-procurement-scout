# Commission award approvals via the Legistar Web API — the only free,
# structured path to LOCAL award amounts found in the 2026-08-09 statewide
# survey (docs/SOURCES.md). Clients below were live-verified that day.
# Miami-Dade's instance is dead (frozen July 2018) and deliberately absent.
sources:
  - id: legistar_broward
    name: Broward County commission awards
    county: broward
    agency: Broward County
    live_fetch: true
    adapter: legistar
    platform: legistar
    legistar_client: broward
    portal_url: https://broward.legistar.com/Legislation.aspx

  - id: legistar_fortlauderdale
    name: Fort Lauderdale commission awards
    county: broward
    agency: City of Fort Lauderdale
    live_fetch: true
    adapter: legistar
    platform: legistar
    legistar_client: fortlauderdale
    portal_url: https://fortlauderdale.legistar.com/Legislation.aspx

