  # ---------------------------------------------------------------------
  # Statewide. One adapter, every state-level advertisement.
  # Rule 60A-1.021, F.A.C. makes the MyFloridaMarketPlace Vendor Information
  # Portal the state's mandatory posting point, so this single source covers
  # every executive-branch agency, all 12 state universities, the state
  # colleges and all 5 water management districts — free and without a login.
  # ---------------------------------------------------------------------
  - id: mfmp_vbs
    name: MyFloridaMarketPlace (State of Florida)
    county: statewide
    agency: State of Florida
    live_fetch: true
    adapter: mfmp_vbs
    portal_url: https://vendor.myfloridamarketplace.com/search/bids
    register_url: https://vendor.myfloridamarketplace.com/

  # The state contract register (s. 215.985(14)). Not a bid feed — it publishes
  # contracts already executed, and its value is the end date on each one.
  # Walked by `python -m src.cli contracts --refresh`, never by the scheduler:
  # the export is ~53 MB and about fifty seconds of server time.
  - id: facts
    name: FACTS — Florida state contract register
    county: statewide
    agency: State of Florida
    live_fetch: true
    adapter: facts
    platform: facts
    portal_url: https://facts.fldfs.com/Search/ContractSearch.aspx

  # FDOT advertisements. Not on bidletting.fdot.gov — that host is bid openings
  # that have already happened. These come from the Procurement Development
  # Application, which needs a page-scoped token before its API will answer.
  #
  # Two procurement paths, kept separate because they are separate streams with
  # separate ad numbers: PS is professional services under the Consultants'
  # Competitive Negotiation Act, D-B is design-build.
  #
  # Both carry Notices of Planned Advertisement — work FDOT has scheduled but
  # not yet advertised — which arrive as `upcoming` and are months earlier than
  # anything else this project sees.
  - id: miami_dade_awards
    name: Miami-Dade ISD award recommendations
    county: miami-dade
