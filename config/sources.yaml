  # ---------------------------------------------------------------------
  # BidNet Direct — catalog only, deliberately.
  #
  # These agencies publish on BidNet and nowhere else we can read. The
  # listings are visible without a login and robots.txt's `*` group permits
  # the pages, but BidNet's terms of use sit behind `Disallow: /public/info/`
  # — so the one document that decides the question cannot be fetched without
  # breaking the rule the fetch would rely on. They also block `anthropic-ai`,
  # `ClaudeBot` and `Claude-Web` by name. See docs/statewide-coverage.md §3a.
