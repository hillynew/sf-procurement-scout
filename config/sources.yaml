  #
  # UNF is deliberately absent. Its page carries a dated notice — "Beginning
  # July 1, 2026, all University of North Florida solicitations will be posted
  # through the University's new Bid Portal" — and both live tabs return no
  # events. It moved to Workday Strategic Sourcing. A source that can only ever
  # return zero reads as a quiet agency rather than a departed one.
  #
  # USF was recorded here as "a tenant with nothing in any tab, a shell, not a
  # source". That was the wrong tenant key. `CustomerOrg=USF` is empty;
  # `CustomerOrg=USFlorida`, which USF's own purchasing page links, returns 25
  # archived solicitations. The key came from the fingerprint sweep following
  # one more hop off `usf.edu/business-finance/purchasing` — the same lesson as
