# Vendor Registry Florida buyers — ARCHIVE ONLY.
#
# These produce no open bids and are not meant to. The platform's current list
# reports "no open solicitations" for every buyer in every state — fifteen were
# checked on 7 Aug 2026, including Williamson County TN, one of Vendor
# Registry's own flagship customers — and every archive stops between October
# 2023 and January 2026. mdf commerce owns both Vendor Registry and BidNet
# Direct, and these tenants have moved.
#
# What they are here for is `src/pipeline/history.py`, which joins past
# solicitations to open ones on agency name. Santa Rosa County and Central
# Florida Expressway both post on OpenGov now and are fetched live in this
# build; their Vendor Registry archives reach back years further than those
# portals do, so recurrence for them improves the moment this is walked.
#
# `python -m src.cli history` reads these. The normal fetch skips straight past
# them with an `empty_note` saying why.
#
# Only buyers whose Florida identity could be established are here. Vendor
# Registry's pages carry no state, and "Madison County", "Union County",
# "Calhoun County" and "City of Holly Hill" all exist in several — including
# in states where this platform is much more common than it is in Florida. They
# are left out rather than guessed at, the same rule the VendorLink directory
# uses. Their buyer GUIDs are recorded in research/README_DATA.md for whoever
# can confirm them.
sources:
- id: vr_santa_rosa
  name: Santa Rosa County (Vendor Registry archive)
  county: santa-rosa
  agency: Santa Rosa County
  live_fetch: true
  adapter: vendor_registry
  platform: vendor_registry
  vendor_registry_buyer: 2a63b069-a1a0-47e8-9417-6007f31792d0
  portal_url: https://vrapp.vendorregistry.com/Bids/View/ExpiredBidsList?BuyerId=2a63b069-a1a0-47e8-9417-6007f31792d0
