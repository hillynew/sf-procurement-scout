# VendorLink Florida agencies — catalog pointers, deliberately not fetched.
#
# The adapter that read these 66 boards was REMOVED on 2026-08-09, the day
# VendorLink's Terms and Conditions were finally located and read: §5(H)
# forbids "any robot, spider, other automatic device, or manual process to
# monitor or copy" their pages, under a browse-wrap that binds on use.
# See src/terms.py ("vendorlink") for the full verdict and docs/SOURCES.md.
#
# The agencies are kept as catalog pointers so the coverage gap stays visible
# in the app instead of becoming silence. The sanctioned way to read this
# platform is their statewide subscription (~$175/yr) — a decision for the
# owner, recorded in docs/statewide-coverage.md §4.
