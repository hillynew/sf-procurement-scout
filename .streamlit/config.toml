[server]
headless = true
# enableCORS must stay true while XSRF protection is on — Streamlit ignores
# the combination `enableCORS=false` + `enableXsrfProtection=true` and warns.
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#04719E"
backgroundColor = "#F8F9FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#101828"
font = "sans serif"
